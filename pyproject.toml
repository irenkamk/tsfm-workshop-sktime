[project]
name = "tsfm-workshop"
version = "0.1.0"
description = "A 90-minute, sktime-based time-series foundation-model workshop"
requires-python = ">=3.11,<3.14"
dependencies = [
  "sktime==1.3.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "statsmodels==0.14.6",
  "matplotlib==3.10.8",
  "jupyterlab==4.5.0",
  "ipykernel==6.30.1",
  "nbformat==5.10.4",
  "nbclient==0.10.4",
]

[project.optional-dependencies]
foundation = [
  "chronos-forecasting==2.3.2",
  "tfc-t0[torch]==0.6.1",
  "transformers==5.23.0",
  "torch>=2.4,<3",
  "accelerate>=1.1,<2",
]
prophet = ["prophet==1.1.7", "cmdstanpy==1.2.5"]

[tool.uv]
package = false